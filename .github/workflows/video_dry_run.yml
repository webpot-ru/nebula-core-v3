name: Dry-Run Video Render

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel ID to test (acc1 to acc7)'
        required: true
        default: 'acc4'
        type: choice
        options:
          - acc1
          - acc2
          - acc3
          - acc4
          - acc5
          - acc6
          - acc7
      time_filter:
        description: 'Reddit top posts time filter, or auto for topic-family windows'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - day
          - week
          - month
          - year
      topic_family:
        description: 'Topic strategy for manual dry-run tests'
        required: false
        default: 'channel_mix'
        type: choice
        options:
          - channel_mix
          - human_drama
          - dark_curiosity
          - curiosity_facts
          - football_culture
          - internet_lore
          - visual_comedy
      video_slot:
        description: 'Slot number for duplicate/fatigue checks'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      content_format:
        description: 'Content length target for the dry-run artifact'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - shorts
          - long

jobs:
  render-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install render system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            sudo apt-get install -y chromium
          fi

      - name: Resolve Target Channel
        id: target
        run: |
          CHANNEL_ID="${{ github.event.inputs.channel || 'acc4' }}"
          TIME_FILTER="${{ github.event.inputs.time_filter || 'auto' }}"
          TOPIC_FAMILY="${{ github.event.inputs.topic_family || 'channel_mix' }}"
          if [ "$TOPIC_FAMILY" = "channel_mix" ]; then
            TOPIC_FAMILY=""
          fi
          VIDEO_SLOT="${{ github.event.inputs.video_slot || '1' }}"
          CONTENT_FORMAT="${{ github.event.inputs.content_format || 'auto' }}"
          echo "channel_id=${CHANNEL_ID}" >> $GITHUB_OUTPUT
          echo "time_filter=${TIME_FILTER}" >> $GITHUB_OUTPUT
          echo "topic_family=${TOPIC_FAMILY}" >> $GITHUB_OUTPUT
          echo "video_slot=${VIDEO_SLOT}" >> $GITHUB_OUTPUT
          echo "content_format=${CONTENT_FORMAT}" >> $GITHUB_OUTPUT
          echo "📺 dry-run ${CHANNEL_ID} | slot=${VIDEO_SLOT} | filter=${TIME_FILTER} | topic=${TOPIC_FAMILY:-mixed} | format=${CONTENT_FORMAT}"

      - name: Fetch viral story from Reddit
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
          AI_QUALITY_CHECK: '1'
          AI_QUALITY_FAIL_OPEN: '0'
          MAX_AI_CANDIDATES: '5'
          STORY_SIMILARITY_THRESHOLD: '0.72'
          TOPIC_FATIGUE_LOOKBACK: '10'
        run: |
          EXTRA_ARGS=()
          if [ -n "${{ steps.target.outputs.topic_family }}" ]; then
            EXTRA_ARGS+=(--topic-family "${{ steps.target.outputs.topic_family }}")
          fi
          if [ "${{ steps.target.outputs.content_format }}" = "shorts" ]; then
            EXTRA_ARGS+=(--format-intent shorts --max-body-chars 900 --comment-limit 0)
          elif [ "${{ steps.target.outputs.content_format }}" = "long" ]; then
            EXTRA_ARGS+=(--format-intent long)
          fi
          python scraper.py \
            --channel ${{ steps.target.outputs.channel_id }} \
            --time ${{ steps.target.outputs.time_filter }} \
            --video-slot ${{ steps.target.outputs.video_slot }} \
            "${EXTRA_ARGS[@]}"

      - name: Adapt story with source-backed hook
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
        run: |
          ADAPTER_ARGS=()
          if [ "${{ steps.target.outputs.content_format }}" = "shorts" ]; then
            ADAPTER_ARGS+=(--max-body-chars 900)
          fi
          python story_adapter.py \
            --channel ${{ steps.target.outputs.channel_id }} \
            --story story_data.json \
            --output story_data.json \
            --confirm-spend \
            --strict-evidence \
            "${ADAPTER_ARGS[@]}"

      - name: Generate Gemini packaging metadata
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
        run: |
          python metadata_generator.py \
            --channel ${{ steps.target.outputs.channel_id }} \
            --confirm-spend \
            --output youtube_metadata.json

      - name: Translate & Generate AI33 neural voice audio
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
        run: |
          # Request transcript with alignment timestamps and download voice narration track
          python translator_tts.py --channel ${{ steps.target.outputs.channel_id }} --with-transcript --output narration.mp3

      - name: Generate storyboard JSON
        run: |
          python storyboard_generator.py --input story_data.json --output storyboard.json

      - name: Render dry-run MP4 (100 frames)
        run: |
          ORIENTATION_ARGS=()
          if [ "${{ steps.target.outputs.content_format }}" = "shorts" ]; then
            ORIENTATION_ARGS+=(--orientation vertical)
          fi
          python render.py \
            --storyboard storyboard.json \
            --output final_output.mp4 \
            --report render_report.json \
            --frame-count 100 \
            --require-karaoke \
            "${ORIENTATION_ARGS[@]}"

      - name: Pre-publish QA gate
        run: |
          python pre_publish_qa.py \
            --channel ${{ steps.target.outputs.channel_id }} \
            --story story_data.json \
            --storyboard storyboard.json \
            --metadata youtube_metadata.json \
            --video final_output.mp4 \
            --audio narration.mp3 \
            --transcript narration.json \
            --render-report render_report.json \
            --output pre_publish_qa.json \
            --require-audio \
            --require-karaoke \
            --require-adaptation \
            --require-evidence \
            --require-render-report

      - name: Verify final output
        run: |
          test -s final_output.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate:format=duration,size -of json final_output.mp4

      - name: Generate preview frames
        run: |
          mkdir -p build/render/previews
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i final_output.mp4 -frames:v 1 build/render/previews/preview_01.png
          ffmpeg -hide_banner -loglevel error -y -ss 10 -i final_output.mp4 -frames:v 1 build/render/previews/preview_mid.png
          ffmpeg -hide_banner -loglevel error -y -ss 18 -i final_output.mp4 -frames:v 1 build/render/previews/preview_end.png

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chonker-test-${{ steps.target.outputs.channel_id }}
          path: |
            final_output.mp4
            storyboard.json
            story_data.json
            producer_queue.json
            youtube_metadata.json
            narration.mp3
            narration.json
            render_report.json
            pre_publish_qa.json
            build/render/render_story.json
            build/render/previews/*.png
          if-no-files-found: error
