name: Voice Samples and YouTube Mapping Audit

on:
  workflow_dispatch:
    inputs:
      check_youtube_mapping:
        description: 'Run YouTube refresh-token to channel mapping audit'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      generate_voice_samples:
        description: 'Generate short AI33 voice samples for configured voices'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      channels:
        description: 'Comma-separated channel IDs for voice samples, or all'
        required: true
        default: 'all'
      model_id:
        description: 'AI33 TTS model_id'
        required: true
        default: 'eleven_v3'
      text_style:
        description: 'Voice sample text style'
        required: true
        default: 'emotional'
        type: choice
        options: ['emotional', 'horror_plain', 'neutral']
      voice_settings_profile:
        description: 'AI33/ElevenLabs voice_settings profile for samples'
        required: true
        default: 'creative'
        type: choice
        options: ['creative', 'natural', 'robust', 'default']
      voice_settings_json:
        description: 'Optional raw voice_settings JSON override for samples'
        required: false
        default: ''
      voice_id_override:
        description: 'Optional narrator voice ID for one bounded manual sample'
        required: false
        default: ''
      generate_disclosure_day_narration:
        description: 'One-off 18-part Disclosure Day narration through the existing AI33 secret'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      disclosure_day_confirm:
        description: 'Exact confirmation phrase for the one-off 18-call AI33 scope'
        required: false
        default: ''
      disclosure_day_bundle_b64:
        description: 'Base64 tar.gz with the checksum-bound TTS plan and local runner'
        required: false
        default: ''
      disclosure_day_bundle_sha256:
        description: 'Expected SHA-256 of the decoded one-off TTS bundle'
        required: false
        default: ''

jobs:
  youtube-mapping:
    if: ${{ github.event.inputs.check_youtube_mapping == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        account: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify YouTube channel token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_ACC1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC1 }}
          YOUTUBE_REFRESH_TOKEN_ACC2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC2 }}
          YOUTUBE_REFRESH_TOKEN_ACC3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC3 }}
          YOUTUBE_REFRESH_TOKEN_ACC4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC4 }}
          YOUTUBE_REFRESH_TOKEN_ACC5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC5 }}
          YOUTUBE_REFRESH_TOKEN_ACC6: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC6 }}
          YOUTUBE_REFRESH_TOKEN_ACC7: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ACC7 }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/audit/youtube-mapping
          {
            echo "== OAuth scopes =="
            python uploader.py \
              --check-token-scopes-only \
              --account-index ${{ matrix.account }}
            echo "== Channel mapping =="
            python uploader.py \
              --check-channel-only \
              --account-index ${{ matrix.account }}
          } 2>&1 | tee build/audit/youtube-mapping/acc${{ matrix.account }}.log

      - name: Upload mapping log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-mapping-acc${{ matrix.account }}
          path: build/audit/youtube-mapping/acc${{ matrix.account }}.log
          if-no-files-found: warn

  voice-samples:
    if: ${{ github.event.inputs.generate_voice_samples == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download verified acc1 background artifact
        if: ${{ github.event.inputs.channels == 'acc1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/emotion_demo/source
          gh run download 29184260452 \
            --repo "$GITHUB_REPOSITORY" \
            --name reddit-source-smoke-acc1-29184260452 \
            --dir build/emotion_demo/source

      - name: Generate AI33 voice samples
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          VOICE_SETTINGS_JSON: ${{ github.event.inputs.voice_settings_json }}
          VOICE_ID_OVERRIDE: ${{ github.event.inputs.voice_id_override }}
        run: |
          extra_args=()
          if [ -n "$VOICE_SETTINGS_JSON" ]; then
            extra_args+=(--voice-settings-json "$VOICE_SETTINGS_JSON")
          fi
          if [ -n "$VOICE_ID_OVERRIDE" ]; then
            extra_args+=(--voice-id-override "$VOICE_ID_OVERRIDE")
          fi
          python scripts/generate_ai33_voice_samples.py \
            --channels "${{ github.event.inputs.channels }}" \
            --model-id "${{ github.event.inputs.model_id }}" \
            --require-model-id eleven_v3 \
            --text-style "${{ github.event.inputs.text_style }}" \
            --voice-settings-profile "${{ github.event.inputs.voice_settings_profile }}" \
            --output-dir build/voice_samples \
            --roles narrator --with-transcript \
            "${extra_args[@]}"

      - name: Render acc1 emotion video proof
        if: ${{ github.event.inputs.channels == 'acc1' }}
        run: |
          MANIFEST=$(find build/voice_samples -name manifest.json -type f | head -n 1)
          python scripts/render_emotion_video_sample.py \
            --manifest "$MANIFEST" \
            --background build/emotion_demo/source/images/story-01-1u8m7zi.png \
            --output-dir build/emotion_demo/output

      - name: Upload voice samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai33-voice-samples
          path: build/voice_samples
          if-no-files-found: error

      - name: Upload emotion video proof
        if: always() && github.event.inputs.channels == 'acc1'
        uses: actions/upload-artifact@v4
        with:
          name: acc1-emotion-video-sample
          path: build/emotion_demo/output
          if-no-files-found: error

  disclosure-day-narration:
    if: ${{ github.event.inputs.generate_disclosure_day_narration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Require the isolated 18-call scope
        env:
          CHECK_YOUTUBE_MAPPING: ${{ github.event.inputs.check_youtube_mapping }}
          GENERATE_VOICE_SAMPLES: ${{ github.event.inputs.generate_voice_samples }}
          DISCLOSURE_DAY_CONFIRM: ${{ github.event.inputs.disclosure_day_confirm }}
          DISCLOSURE_DAY_BUNDLE_B64: ${{ github.event.inputs.disclosure_day_bundle_b64 }}
          DISCLOSURE_DAY_BUNDLE_SHA256: ${{ github.event.inputs.disclosure_day_bundle_sha256 }}
        run: |
          set -euo pipefail
          test "$CHECK_YOUTUBE_MAPPING" = "false"
          test "$GENERATE_VOICE_SAMPLES" = "false"
          test "$DISCLOSURE_DAY_CONFIRM" = "DISCLOSURE_DAY_EXACTLY_18_AI33_CALLS"
          test -n "$DISCLOSURE_DAY_BUNDLE_B64"
          test -n "$DISCLOSURE_DAY_BUNDLE_SHA256"
          mkdir -p build/disclosure-day-tts
          python -c 'import base64,os,pathlib; pathlib.Path("build/disclosure-day-tts-bundle.tgz").write_bytes(base64.b64decode(os.environ["DISCLOSURE_DAY_BUNDLE_B64"], validate=True))'
          echo "$DISCLOSURE_DAY_BUNDLE_SHA256  build/disclosure-day-tts-bundle.tgz" | sha256sum --check --strict
          tar -xzf build/disclosure-day-tts-bundle.tgz -C build/disclosure-day-tts

      - name: Verify the immutable voice and spend plan
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/disclosure-day-tts")
          config = json.loads((root / "TTS_CONFIG.json").read_text(encoding="utf-8"))
          plan = json.loads((root / "work/tts/tts-plan.json").read_text(encoding="utf-8"))

          assert config["provider"] == "ai33"
          assert config["voice_id"] == "elevenlabs_JBFqnCBsd6RMkjVDRZzb"
          assert config["model_id"] == "eleven_v3"
          assert config["speed"] == 1
          assert config["voice_settings"] is None
          assert config["context_chaining"] is False
          assert config["with_transcript"] is True
          assert plan["voice_id"] == config["voice_id"]
          assert plan["model_id"] == config["model_id"]
          assert plan["chapter_count"] == 18
          assert plan["request_count"] == 18
          assert plan["total_chars"] == 16779
          assert len(plan["requests"]) == 18
          assert len({item["id"] for item in plan["requests"]}) == 18
          assert all(item["chapter_id"] == f"chapter-{index:02d}" for index, item in enumerate(plan["requests"], 1))
          assert all(0 < int(item["chars"]) <= 2200 for item in plan["requests"])
          assert (root / "scripts/run-ai33-tts.mjs").is_file()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audio probe and assembly tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Generate exactly 18 AI33 narration parts
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
        run: |
          set -euo pipefail
          node build/disclosure-day-tts/scripts/run-ai33-tts.mjs \
            --confirm-calls=18 \
            2>&1 | tee build/disclosure-day-tts/provider-run.log

      - name: Verify complete narration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/disclosure-day-tts/work/tts")
          state = json.loads((root / "tts-state.json").read_text(encoding="utf-8"))
          report = json.loads((root / "tts-report.json").read_text(encoding="utf-8"))
          assert len(state["requests"]) == 18
          assert all(item["status"] == "complete" for item in state["requests"].values())
          assert report["status"] == "complete"
          assert report["voice_id"] == "elevenlabs_JBFqnCBsd6RMkjVDRZzb"
          assert report["model_id"] == "eleven_v3"
          assert report["speed"] == 1
          assert len(report["chapters"]) == 18
          assert (root / report["narration_path"]).is_file()
          PY
          ffprobe -v error \
            -show_entries format=duration:stream=codec_name,sample_rate,channels \
            -of json \
            build/disclosure-day-tts/work/tts/narration.mp3

      - name: Upload the one-off TTS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disclosure-day-ai33-${{ github.run_id }}
          path: build/disclosure-day-tts
          if-no-files-found: error
          retention-days: 14
