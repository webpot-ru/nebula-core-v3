name: acc1 Bounded Visual Canary
run-name: acc1 bounded panel-grammar or image-size canary at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "29888971818"
        type: string
      confirm_exactly_five_image_calls:
        description: Confirm exactly five VectorEngine image calls, no retries
        required: true
        default: false
        type: boolean
      confirm_exactly_one_image_size_canary:
        description: Confirm exactly one production image-size call, no retries
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: acc1-bounded-image-canary-paid
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse reruns and require exactly one paid scope
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONFIRM_FIVE: ${{ inputs.confirm_exactly_five_image_calls }}
          CONFIRM_ONE: ${{ inputs.confirm_exactly_one_image_size_canary }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = "1"
          python - <<'PY'
          import os

          selected = [
              os.environ["CONFIRM_FIVE"] == "true",
              os.environ["CONFIRM_ONE"] == "true",
          ]
          if sum(selected) != 1:
              raise SystemExit("exactly one bounded paid scope must be selected")
          PY

  panel-grammar-canary:
    needs: scope
    if: ${{ inputs.confirm_exactly_five_image_calls }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      SOURCE: build/acc1-existing
      OUTPUT: build/acc1-panel-grammar-canary
    steps:
      - name: Require exact bounded scope
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM: ${{ inputs.confirm_exactly_five_image_calls }}
        run: |
          test "$SOURCE_RUN_ID" = "29888971818"
          test "$CONFIRM" = "true"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic render dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx --yes hyperframes@0.7.61 info
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$RUNNER_TEMP/hyperframes-browsers"
          browser_path="$(find "$RUNNER_TEMP/hyperframes-browsers" \
            -type f -name chrome-headless-shell -perm -111 | head -n 1)"
          test -x "$browser_path"
          echo "HYPERFRAMES_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Download completed storyboard and master audio
        uses: actions/download-artifact@v4
        with:
          name: acc1-segmented-preparation-29888971818
          path: ${{ env.SOURCE }}
          github-token: ${{ github.token }}
          repository: webpot-ru/nebula-core-v3
          run-id: 29888971818
      - name: Generate five approved format v3 pages
        env:
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
        run: |
          python scripts/generate_acc1_webtoon_canary_pages.py \
            --artifact-root "$SOURCE" \
            --output-dir "$OUTPUT/generated-input" \
            --page-count 5 \
            --confirm-exactly-five-image-calls
      - name: Render five new comic scenes with existing narration in HyperFrames
        run: |
          python scripts/render_acc1_hyperframes_realistic_test.py \
            --artifact-root "$OUTPUT/generated-input" \
            --audio-root "$SOURCE" \
            --output-dir "$OUTPUT" \
            --expected-page-count 5 \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-artifact "acc1-panel-grammar-canary-$GITHUB_RUN_ID" \
            --new-image-calls 5
      - name: Verify bounded panel-grammar output
        run: |
          test -s "$OUTPUT/acc1-hyperframes-realistic-test.mp4"
          test -s "$OUTPUT/captions-brand-safe.srt"
          test -s "$OUTPUT/captions-brand-safe.ass"
          test "$(find "$OUTPUT/frames" -type f -name 'frame-*.png' | wc -l)" -eq 5
          python - "$OUTPUT/render-report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['renderer']=='hyperframes'
          assert report['hyperframes_check_passed'] is True
          assert report['source_image_calls']==5
          assert report['new_ai33_calls']==0 and report['new_image_calls']==5
          assert report['youtube_called'] is False
          storyboard=json.load(open(sys.argv[1].replace('render-report.json','generated-input/storyboard-generated.json')))
          assert [scene['panel_count'] for scene in storyboard['slides']] == [1,2,3,4,5]
          journal=json.load(open(sys.argv[1].replace('render-report.json','generated-input/paid-image-attempts.json')))
          assert journal['approved_call_cap']==5 and journal['automatic_retries']==0
          assert len(journal['attempts'])==5 and all(item['status']=='complete' for item in journal['attempts'])
          PY
          ffprobe -v error -show_entries stream=codec_type,codec_name -of json "$OUTPUT/acc1-hyperframes-realistic-test.mp4"
      - name: Upload five-page canary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc1-panel-grammar-canary-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14

  image-size-canary:
    needs: scope
    if: ${{ inputs.confirm_exactly_one_image_size_canary }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT: build/acc1-image-size-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded canary dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
      - name: Validate exact production prompt without providers
        run: |
          set -euo pipefail
          python scripts/run_acc1_image_size_canary.py \
            --output-dir "$OUTPUT" \
            --preflight-only
      - name: Generate exactly one production image
        env:
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_acc1_image_size_canary.py \
            --output-dir "$OUTPUT" \
            --confirm-exactly-one-image-call
      - name: Verify one-call landscape result
        run: |
          set -euo pipefail
          python - "$OUTPUT/image-size-canary-result.json" "$OUTPUT/provider-attempts/image.json" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          journal = json.load(open(sys.argv[2], encoding="utf-8"))
          assert result["status"] == "IMAGE_SIZE_CANARY_PASS"
          assert result["provider_requested_size"] == "1536x1024"
          assert result["required_output_size"] == "1536x864"
          assert result["final_dimensions"] == [1536, 864]
          assert result["new_image_calls"] == 1
          assert result["automatic_retries"] == 0
          assert result["new_ai33_calls"] == 0
          assert result["youtube_called"] is False
          assert journal["cap"] == 1
          assert len(journal["attempts"]) == 1
          assert journal["attempts"][0]["status"] == "COMPLETE"
          PY
          test -s "$OUTPUT/scene-images/first-production-page.png"
      - name: Upload one-image canary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc1-image-size-canary-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
