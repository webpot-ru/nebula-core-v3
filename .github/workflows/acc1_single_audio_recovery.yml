name: acc1 Single Audio Existing Task Recovery
run-name: acc1 poll saved master-audio task from ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "29828099086"
        type: string
      confirm_poll_existing_task_only:
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: acc1-single-audio-recovery
      cancel-in-progress: false
    env:
      WORKDIR: build/acc1-single-audio-recovery
    steps:
      - name: Require exact saved-task scope
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM: ${{ inputs.confirm_poll_existing_task_only }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = "29828099086"
          test "$CONFIRM" = "true"
          test "$RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx --yes hyperframes@0.7.61 info
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$RUNNER_TEMP/hyperframes-browsers"
          browser_path="$(find "$RUNNER_TEMP/hyperframes-browsers" \
            -type f -name chrome-headless-shell -perm -111 | head -n 1)"
          test -x "$browser_path"
          echo "HYPERFRAMES_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Download exact saved single-task artifact
        uses: actions/download-artifact@v4
        with:
          name: acc1-single-audio-rerender-29828099086
          path: ${{ env.WORKDIR }}
          github-token: ${{ github.token }}
          repository: webpot-ru/nebula-core-v3
          run-id: 29828099086
      - name: Verify durable task before exposing key
        run: |
          python - "$WORKDIR/tts-single/single-audio-request.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='SUBMITTED'
          assert r['task_id']=='a7ac4460-dd83-4493-86f5-fa850b2995da'
          assert r['provider_task_cap']==1
          assert r['with_transcript'] is True
          PY
      - name: Poll existing task with long timeout and render
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          AI33_PRONUNCIATION_DICTIONARY_ID: ${{ secrets.AI33_PRONUNCIATION_DICTIONARY_ID }}
        run: |
          timeout --signal=TERM --kill-after=60s 18000s \
            python scripts/rerender_acc1_single_audio.py \
              --artifact-root "$WORKDIR" --produce --resume-existing-task-only
      - name: Verify zero new submissions
        run: |
          python - "$WORKDIR/single-audio-rerender-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='READY_FOR_HUMAN_REVIEW'
          assert r['ai33_task_submissions']==0
          assert r['existing_ai33_task_polled'] is True
          assert r['image_calls']==0
          assert r['youtube_called'] is False
          PY
          test -s "$WORKDIR/tts-single/narration-master.mp3"
          test -s "$WORKDIR/tts-single/narration.srt"
          test -s "$WORKDIR/final-output-single-audio.mp4"
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc1-single-audio-recovered-${{ github.run_id }}
          path: ${{ env.WORKDIR }}
          if-no-files-found: error
          retention-days: 30
