name: acc1 Four-Page Format v3 Canary
run-name: acc1 four new format v3 pages from ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "29888971818"
        type: string
      confirm_exactly_four_image_calls:
        description: Confirm exactly four VectorEngine image calls, no retries
        required: true
        default: false
        type: boolean
      confirm_hyperframes_reuse_only:
        description: Reuse run 29975009888 only; no provider calls or YouTube
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  canary:
    if: ${{ !inputs.confirm_hyperframes_reuse_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE: build/acc1-existing
      OUTPUT: build/acc1-existing/canary-output
    steps:
      - name: Require exact bounded scope
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM: ${{ inputs.confirm_exactly_four_image_calls }}
        run: |
          test "$SOURCE_RUN_ID" = "29888971818"
          test "$CONFIRM" = "true"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic render dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx --yes hyperframes@0.7.61 info
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$RUNNER_TEMP/hyperframes-browsers"
          browser_path="$(find "$RUNNER_TEMP/hyperframes-browsers" \
            -type f -name chrome-headless-shell -perm -111 | head -n 1)"
          test -x "$browser_path"
          echo "HYPERFRAMES_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Download completed storyboard and master audio
        uses: actions/download-artifact@v4
        with:
          name: acc1-segmented-preparation-29888971818
          path: ${{ env.SOURCE }}
          github-token: ${{ github.token }}
          repository: webpot-ru/nebula-core-v3
          run-id: 29888971818
      - name: Inventory reusable inputs
        run: |
          find "$SOURCE" -type f -printf '%P\n' | sort | head -300
      - name: Generate exactly four approved format v3 pages
        env:
          VECTORENGINE_API_KEY: ${{ secrets.VECTORENGINE_API_KEY }}
        run: python scripts/generate_acc1_webtoon_canary_pages.py --artifact-root "$SOURCE" --output-dir "$OUTPUT/generated-input" --confirm-exactly-four-image-calls
      - name: Render four new comic scenes with existing narration
        run: python scripts/render_acc1_webtoon_canary.py --artifact-root "$SOURCE" --storyboard-path "$OUTPUT/generated-input/storyboard-generated.json" --output-dir "$OUTPUT" --scene-count 4 --new-image-calls 4
      - name: Verify bounded review output
        run: |
          test -s "$OUTPUT/webtoon-canary.mp4"
          test -s "$OUTPUT/narration-canary.mp3"
          test "$(find "$OUTPUT/frames" -type f -name 'frame-*.png' | wc -l)" -eq 4
          python - "$OUTPUT/render-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['renderer']=='chrome_guided_webtoon_v2'
          assert r['scene_count']==4
          assert r['new_ai33_calls']==0 and r['new_image_calls']==4
          assert r['youtube_called'] is False
          j=json.load(open(sys.argv[1].replace('render-report.json','generated-input/paid-image-attempts.json')))
          assert j['approved_call_cap']==4 and j['automatic_retries']==0
          assert len(j['attempts'])==4 and all(x['status']=='complete' for x in j['attempts'])
          PY
          ffprobe -v error -show_entries stream=codec_type,codec_name -of json "$OUTPUT/webtoon-canary.mp4"
      - name: Upload short canary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc1-format-v3-canary-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14

  hyperframes-realistic-test:
    if: ${{ inputs.confirm_hyperframes_reuse_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE: build/acc1-hyperframes-source
      OUTPUT: build/acc1-hyperframes-review
    steps:
      - name: Require exact no-spend scope
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM_REUSE_ONLY: ${{ inputs.confirm_hyperframes_reuse_only }}
          CONFIRM_PAID_IMAGES: ${{ inputs.confirm_exactly_four_image_calls }}
        run: |
          test "$SOURCE_RUN_ID" = "29975009888"
          test "$CONFIRM_REUSE_ONLY" = "true"
          test "$CONFIRM_PAID_IMAGES" = "false"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic HyperFrames dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npx --yes hyperframes@0.7.61 info
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$RUNNER_TEMP/hyperframes-browsers"
          browser_path="$(find "$RUNNER_TEMP/hyperframes-browsers" \
            -type f -name chrome-headless-shell -perm -111 | head -n 1)"
          test -x "$browser_path"
          echo "HYPERFRAMES_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Download four completed v3 pages and existing narration
        uses: actions/download-artifact@v4
        with:
          name: acc1-format-v3-canary-29975009888
          path: ${{ env.SOURCE }}
          github-token: ${{ github.token }}
          repository: webpot-ru/nebula-core-v3
          run-id: 29975009888
      - name: Render production-shaped short test in HyperFrames
        run: |
          python scripts/render_acc1_hyperframes_realistic_test.py \
            --artifact-root "$SOURCE" \
            --output-dir "$OUTPUT"
      - name: Verify style, motion, branding and bounded scope
        run: |
          test -s "$OUTPUT/acc1-hyperframes-realistic-test.mp4"
          test -s "$OUTPUT/captions-brand-safe.srt"
          test "$(find "$OUTPUT/frames" -type f -name 'frame-*.png' | wc -l)" -eq 4
          python - "$OUTPUT/render-report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report["status"] == "PASS"
          assert report["renderer"] == "hyperframes"
          assert report["hyperframes_check_passed"] is True
          assert report["style_profile"] == "acc1_format_visual_system_v3"
          assert report["source_image_calls"] == 4
          assert report["source_image_retries"] == 0
          assert report["new_image_calls"] == 0
          assert report["new_ai33_calls"] == 0
          assert report["youtube_called"] is False
          assert report["captions_burned"] is True
          assert report["caption_band_height_px"] == 130
          for key in ("brand_sting_used", "brand_cta_used", "brand_outro_used"):
              assert report[key] is True
          PY
          ffprobe -v error -show_entries \
            stream=codec_name,width,height,avg_frame_rate:format=duration \
            -of json "$OUTPUT/acc1-hyperframes-realistic-test.mp4"
      - name: Upload HyperFrames review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc1-hyperframes-realistic-test-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14
