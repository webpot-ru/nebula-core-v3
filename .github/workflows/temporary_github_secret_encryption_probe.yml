name: Temporary GitHub Secret Encryption Probe

on:
  push:
    branches:
      - codex/oauth-acc1-recovery-20260726

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify GitHub-owned secret encryption without storing
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/oauth-acc1-recovery-20260726"
          printf '%s' 'non-sensitive-encryption-probe' |
            gh secret set TEMPORARY_ENCRYPTION_PROBE \
              --repo webpot-ru/nebula-core-v3 \
              --no-store > encrypted-value.txt
          test -s encrypted-value.txt
          python3 - <<'PY'
          import base64
          from pathlib import Path

          encoded = Path("encrypted-value.txt").read_text(encoding="utf-8").strip()
          ciphertext = base64.b64decode(encoded, validate=True)
          if len(ciphertext) < 32:
              raise SystemExit("Encrypted value is unexpectedly short")
          print("GitHub-owned secret encryption is available.")
          PY
