name: acc1 Single Audio SRT Rerender
run-name: acc1 one-task audio rerender from ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        default: "29826255693"
        type: string
      confirm_one_ai33_task:
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: acc1-single-audio-rerender
      cancel-in-progress: false
    env:
      WORKDIR: build/acc1-single-audio-rerender
    steps:
      - name: Require exact scope
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CONFIRM_ONE: ${{ inputs.confirm_one_ai33_task }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = "29826255693"
          test "$CONFIRM_ONE" = "true"
          test "$RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx --yes hyperframes@0.7.61 info
      - name: Download exact completed recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: acc1-fixed-first-release-recovered-29826255693
          path: ${{ env.WORKDIR }}
          github-token: ${{ github.token }}
          repository: webpot-ru/nebula-core-v3
          run-id: 29826255693
      - name: Prove one-task plan before exposing AI33 key
        run: |
          python scripts/rerender_acc1_single_audio.py --artifact-root "$WORKDIR" > preflight.json
          python - <<'PY'
          import json
          p=json.load(open('preflight.json'))
          assert p['status']=='SINGLE_AUDIO_PREFLIGHT_PASS'
          assert p['provider_task_cap']==1
          assert p['automatic_tts_retries']==0
          assert p['image_calls_authorized']==0
          assert p['youtube_called'] is False
          PY
      - name: Create one master MP3 and SRT then render
        env:
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          AI33_PRONUNCIATION_DICTIONARY_ID: ${{ secrets.AI33_PRONUNCIATION_DICTIONARY_ID }}
        run: |
          timeout --signal=TERM --kill-after=60s 18000s \
            python scripts/rerender_acc1_single_audio.py \
              --artifact-root "$WORKDIR" --produce --confirm-one-ai33-task
      - name: Verify result without publication
        run: |
          python - "$WORKDIR/single-audio-rerender-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='READY_FOR_HUMAN_REVIEW'
          assert r['ai33_task_submissions']==1
          assert r['image_calls']==0
          assert r['youtube_called'] is False
          assert r['publication_authorized'] is False
          PY
          test -s "$WORKDIR/tts-single/narration-master.mp3"
          test -s "$WORKDIR/tts-single/narration.srt"
          test -s "$WORKDIR/final-output-single-audio.mp4"
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc1-single-audio-rerender-${{ github.run_id }}
          path: ${{ env.WORKDIR }}
          if-no-files-found: error
          retention-days: 30
